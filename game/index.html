<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Sötét Képernyő (Dark Screen)</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="touch.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#07070a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sötét Képernyő">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<canvas id="view"></canvas>
<div id="hud" class="hidden">
  <div id="checklist"></div>
  <div id="objective"></div>
  <div id="status">
    <div id="eyebox" title="Noise: how much 'something' has heard you"><img id="eyeimg" alt=""><div id="eyefill"><div></div></div></div>
    <div id="battbox" title="Flashlight battery"><span>Battery</span><div id="batt"><div id="battfill"></div></div></div>
  </div>
  <div id="crosshair"></div>
  <div id="prompt"><img id="ekey" alt="E"><span id="prompttext"></span></div>
  <div id="toasts"></div>
  <div id="captions"></div>
  <div id="carry"></div>
</div>
<div id="overlay"></div>
<div id="fade"><div id="fadetext"></div></div>
<div id="flash"></div>
<div id="saveicon"><img id="saveimg" alt="saved"></div>
<div id="tooltip" role="tooltip"></div>
<div id="loading"><div class="ltitle">SÖTÉT KÉPERNYŐ</div><div id="lbar"><div id="lfill"></div></div><div id="lmsg">Loading…</div></div>
<script src="game.js"></script>
<script src="splash_screen.js"></script>
<script src="touch_controls.js"></script>
<script src="gyro_aim.js"></script>
<script src="virtual_keyboard.js"></script>
<script src="audio_haptics.js"></script>
</body>
</html>
