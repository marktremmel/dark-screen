<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- CRT TV Screen Gradient -->
    <radialGradient id="crtGlass" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141c19"/>
      <stop offset="60%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#040406"/>
    </radialGradient>

    <!-- Phosphor Eye / Iris Glow -->
    <radialGradient id="irisGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#8fe3c9"/>
      <stop offset="70%" stop-color="#2c5a4d"/>
      <stop offset="100%" stop-color="#091410"/>
    </radialGradient>

    <!-- Scanline Filter -->
    <pattern id="scanlines" width="100" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="rgba(0,0,0,0.4)" stroke-width="2"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Bezel (Dark PSX Plastic Chassis) -->
  <rect x="16" y="16" width="480" height="480" rx="64" fill="#121019" stroke="#363148" stroke-width="10"/>

  <!-- Inner CRT Frame Shadow -->
  <rect x="42" y="42" width="428" height="428" rx="48" fill="#08070c" stroke="#1d1b28" stroke-width="6"/>

  <!-- Curved CRT Glass Screen -->
  <rect x="56" y="56" width="400" height="400" rx="40" fill="url(#crtGlass)"/>

  <!-- Retro Surveillance / Noise Eye Motif -->
  <g filter="url(#bloom)">
    <!-- Eye Sclera / Outer Ring -->
    <ellipse cx="256" cy="256" rx="140" ry="85" fill="none" stroke="#3a6356" stroke-width="6"/>
    <ellipse cx="256" cy="256" rx="120" ry="72" fill="none" stroke="#8fe3c9" stroke-width="4" stroke-dasharray="10 6"/>

    <!-- Glowing Iris / Lens -->
    <circle cx="256" cy="256" r="54" fill="url(#irisGlow)"/>

    <!-- Pupil / Camera Aperture -->
    <circle cx="256" cy="256" r="22" fill="#030304"/>
    <circle cx="244" cy="244" r="6" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- Horizontal Scanlines Overlay -->
  <rect x="56" y="56" width="400" height="400" rx="40" fill="url(#scanlines)" opacity="0.65"/>

  <!-- Camera HUD Brackets (Retro VHS / Security Feed) -->
  <path d="M 85 125 L 85 95 L 115 95" fill="none" stroke="#8fe3c9" stroke-width="5" stroke-linecap="round"/>
  <path d="M 427 125 L 427 95 L 397 95" fill="none" stroke="#8fe3c9" stroke-width="5" stroke-linecap="round"/>
  <path d="M 85 387 L 85 417 L 115 417" fill="none" stroke="#8fe3c9" stroke-width="5" stroke-linecap="round"/>
  <path d="M 427 387 L 427 417 L 397 417" fill="none" stroke="#8fe3c9" stroke-width="5" stroke-linecap="round"/>

  <!-- Blinking REC Indicator -->
  <circle cx="95" cy="155" r="7" fill="#ff4a4a"/>
  <text x="110" y="161" fill="#ff7a7a" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="2">REC</text>

  <!-- Title / Episode Tag -->
  <text x="256" y="440" fill="#8fe3c9" font-family="monospace" font-size="18" text-anchor="middle" letter-spacing="5" opacity="0.85">SÖTÉT KÉPERNYŐ</text>

  <!-- CRT Glass Reflection Sheen -->
  <path d="M 64 64 Q 256 95 448 64 Q 400 240 64 64 Z" fill="rgba(255, 255, 255, 0.04)"/>
</svg>
